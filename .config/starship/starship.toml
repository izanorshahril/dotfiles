# Starship Prompt Configuration (Rosé Pine Moon - WSL2 Agentic Setup)
# Location: ~/.config/starship.toml

# Minimal 2-line prompt with high performance and git worktree awareness
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$package\
$c\
$python\
$nodejs\
$rust\
$cmd_duration\
$line_break\
$character"""

# Timeout for commands executed by starship (ms)
command_timeout = 500

# Directory configuration
[directory]
style = "bold #ea9a97"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bold #eb6f92"

# Git branch
[git_branch]
symbol = " "
style = "bold #c4a7e7"
format = "on [$symbol$branch(:$remote_branch)]($style) "

# Git status
[git_status]
style = "bold #eb6f92"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = " "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Git state (rebase, merge, cherry-pick)
[git_state]
style = "bold #f6c177"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

# Prompt character
[character]
success_symbol = "[❯](bold #9ccfd8)"
error_symbol = "[❯](bold #eb6f92)"
vimcmd_symbol = "[❮](bold #a6adc8)"

# Command execution duration
[cmd_duration]
min_time = 2_000
style = "italic #6e6a86"
format = "took [$duration]($style) "

# Language modules (compact & non-intrusive)
[python]
symbol = " "
style = "bold #f6c177"
format = "via [$symbol$virtualenv]($style) "

[nodejs]
symbol = "󰎙 "
style = "bold #3e8fb0"
format = "via [$symbol($version)]($style) "

[rust]
symbol = "󱘗 "
style = "bold #eb6f92"
format = "via [$symbol($version)]($style) "

# Disable noisy modules by default for speed
[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[docker_context]
disabled = true
